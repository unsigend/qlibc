# C header macros keep only entries whose key starts with CONFIG_
# After editing this file, run: make gen-config

ARCH = x86_64
CC = gcc-15
LIBNAME = qlibc
STD_C = c11
BUILD_METHOD = static

# debug
CONFIG_DEBUG = 1

# version
CONFIG_VERSION_MAJOR = 0
CONFIG_VERSION_MINOR = 1
CONFIG_VERSION_PATCH = 0
